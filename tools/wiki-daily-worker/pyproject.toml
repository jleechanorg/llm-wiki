[project]
name = "wiki-daily-worker"
version = "0.1.0"
description = "Daily wiki maintenance: optional ingest + entity/concept ratio logging"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wiki-daily-worker = "wiki_daily_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_daily_worker"]

[project]
name = "wiki-aggregator"
version = "0.1.0"
description = "Aggregate log entries from per-project wikis into ~/llm_wiki"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wiki-aggregator = "wiki_aggregator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_aggregator"]